<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Microregulação • CRM</title>
<style>
:root{--nav:#102c3a;--ink:#173341;--muted:#607780;--accent:#087f80;--light:#e9f5f4;--line:#dce6e9;--bg:#f4f7f9;--red:#a73542;--amber:#9a6415;--shadow:0 5px 22px #15334308}*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #1daca9;outline-offset:3px}button{border:1px solid var(--line);background:white;color:var(--ink);border-radius:8px;padding:9px 15px;font-weight:600}button:hover{border-color:var(--accent)}.primary{background:var(--accent);border-color:var(--accent);color:white}.danger{color:var(--red)}.small{font-size:13px;padding:6px 11px}.demo{background:#fff4d9;color:#705014;padding:7px 22px;text-align:center;font-size:13px}.shell{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:calc(100vh - 34px)}aside{background:var(--nav);color:#d7e6eb;padding:28px 18px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;align-items:center;gap:10px;padding:0 10px}.mark{width:34px;height:34px;background:#26b6ae;border-radius:9px;display:grid;place-items:center;font-size:24px;font-weight:700;color:#102c3a}.brand strong{display:block;color:white;font-size:17px}.brand small{font-size:12px;color:#a9c1ca}.navlabel{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#88a6b2;padding:0 12px;margin-bottom:10px}nav{display:grid;gap:5px}nav button{background:transparent;border:0;text-align:left;color:#bbd0d8;font-weight:500;padding:12px}nav button.active{background:#234651;color:white}nav button span{margin-right:10px}.sidebar-bottom{margin-top:auto;font-size:12px;line-height:1.8;color:#9db8c2;padding:0 12px}.sidebar-bottom b{color:#d9e9ed;display:block}.workspace{min-width:0}.topbar{background:white;border-bottom:1px solid var(--line);padding:15px 30px;display:flex;align-items:center;justify-content:space-between;gap:16px}.crumb{font-size:13px;color:var(--muted)}.profile{display:flex;align-items:center;gap:10px}.profile label{font-size:12px;color:var(--muted)}.profile select{min-width:200px}.avatar{border-radius:50%;background:var(--light);color:var(--accent);width:35px;height:35px;display:grid;place-items:center;font-weight:700}main{padding:28px 30px 44px;max-width:1700px;margin:auto}.heading{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:23px}.eyebrow{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.08em;text-transform:uppercase}h1{font-size:27px;line-height:1.25;margin:5px 0 8px;font-weight:700;letter-spacing:-.5px}h2{font-size:17px;margin:0 0 4px}p{margin:0;color:var(--muted)}.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:24px}.metric{background:white;border:1px solid var(--line);border-radius:12px;padding:19px 21px;box-shadow:var(--shadow)}.metric label{display:block;color:var(--muted);font-size:13px}.metric strong{font-size:29px;display:block;margin:6px 0 1px;letter-spacing:-.8px}.metric small{font-size:12px;color:var(--muted)}.metric.featured{background:var(--nav);border-color:var(--nav);color:white}.metric.featured label,.metric.featured small{color:#b5cbd3}.card{background:white;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px}.cardhead{padding:19px 21px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}.cardhead p{font-size:13px}.twocol{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px}.cardbody{padding:22px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th{text-align:left;background:#f6f9fa;color:#5b737d;font-size:12px;font-weight:600;padding:12px 18px;white-space:nowrap;border-bottom:1px solid var(--line)}td{padding:14px 18px;border-bottom:1px solid #edf1f3;vertical-align:middle}tr:last-child td{border-bottom:0}.tablewrap tbody tr:hover{background:#f8fbfc}td strong{display:block;font-size:14px;font-weight:600}td small{font-size:12px;display:block;color:var(--muted);margin-top:2px}.pill{display:inline-block;border-radius:5px;font-size:11px;padding:4px 8px;font-weight:700;white-space:nowrap;background:#e9f3f6;color:#246179}.pill.pending{background:#fff3dc;color:#966010}.pill.green{background:#e6f4ed;color:#227047}.pill.red{background:#ffedef;color:#9e3946}.pill.gray{background:#eef1f3;color:#617580}progress{accent-color:var(--accent);width:100px;height:8px}.progress{height:5px;border-radius:3px;background:#e8eff2;margin-top:8px;overflow:hidden;width:100px}.progress span{display:block;background:var(--accent);height:100%}.filters{padding:17px 20px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr auto;gap:12px;align-items:end}label.field{display:grid;gap:6px;font-size:12px;color:var(--muted)}input:not([type=checkbox]),select{border:1px solid #cfdee3;border-radius:7px;background:white;color:var(--ink);padding:9px 11px;max-width:100%;min-width:0}input::placeholder{color:#93a4ac}.footer-table{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;gap:10px}.empty{padding:42px 20px;text-align:center;color:var(--muted)}.activity{display:flex;gap:13px;padding:15px 0;border-bottom:1px solid #edf1f3}.activity:last-child{border:0}.activity .event{background:var(--light);color:var(--accent);width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex-shrink:0}.activity p{color:var(--ink);font-size:13px}.activity small{color:var(--muted);font-size:12px}.drop{border:2px dashed #b7d5d9;background:#f5fbfb;border-radius:11px;padding:35px 20px;text-align:center}.drop.drag{border-color:var(--accent);background:#e5f5f1}.uploadmark{width:45px;height:45px;background:#dff0ef;color:var(--accent);border-radius:12px;margin:0 auto 12px;display:grid;place-items:center;font-size:24px}.drop p{font-size:13px;margin:8px 0 18px}.drop strong{display:block;font-size:17px}.hint{background:#f4f8fa;border:1px solid var(--line);padding:15px;border-radius:8px;font-size:13px;color:var(--muted);margin:17px 0}.hint b{color:var(--ink)}.steps{display:grid;gap:16px;counter-reset:step}.step{display:flex;gap:11px;font-size:13px}.step:before{counter-increment:step;content:counter(step);background:var(--light);color:var(--accent);font-weight:700;border-radius:50%;width:26px;height:26px;flex-shrink:0;display:grid;place-items:center}.step strong{display:block}.step p{font-size:13px;margin-top:3px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:10px}.check{display:flex;gap:9px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:7px;font-size:13px}.check input{margin:4px 0 0;accent-color:var(--accent)}.check:has(input:checked){background:var(--light);border-color:#b3d9d6}.unit-tags{display:flex;flex-wrap:wrap;gap:5px}.tag{background:#eff5f6;border-radius:4px;padding:3px 7px;font-size:11px;color:#456772}.notice{padding:13px 16px;border:1px solid #bad9d7;border-radius:8px;background:#eaf7f4;color:#24695e;font-size:13px;margin-bottom:18px}.notice.error{background:#fff1f1;border-color:#edc6c7;color:var(--red)}.notice.warning{background:#fff7e5;border-color:#ead4a2;color:var(--amber)}dialog{border:0;border-radius:14px;padding:0;max-width:min(820px,calc(100vw - 30px));width:820px;box-shadow:0 25px 100px #07182255;color:var(--ink)}dialog::backdrop{background:#071c2c70}.modalhead{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modalbody{padding:23px 24px;max-height:68vh;overflow:auto}.modalfoot{padding:16px 24px;display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);background:#f9fbfc}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.detailgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding-bottom:20px;margin-bottom:20px;border-bottom:1px solid var(--line)}.detailgrid small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}.detailgrid b{font-size:13px;font-weight:500;overflow-wrap:anywhere}.full{grid-column:1/-1}.toast{position:fixed;bottom:25px;right:25px;z-index:20;background:var(--nav);color:white;padding:14px 20px;border-radius:9px;box-shadow:0 10px 30px #102c3a30;max-width:calc(100vw - 40px)}.right{text-align:right}.nowrap{white-space:nowrap}.muted{color:var(--muted)}.adminonly{display:block}.statline{padding:18px 20px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line);gap:15px}.statline:last-child{border:0}.statline span{font-size:13px;color:var(--muted)}.statline b{font-size:14px}.visuallyhidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.checktitle{font-size:13px;margin:18px 0 10px;font-weight:600}.rowactions{display:flex;gap:8px}.mobilebrand{display:none}
@media(max-width:1100px){.shell{grid-template-columns:200px minmax(0,1fr)}main{padding:24px 20px}.filters{grid-template-columns:1fr 1fr}.filters .field:first-child{grid-column:1/-1}.twocol{grid-template-columns:1fr}.topbar{padding:13px 20px}.metrics{gap:10px}.metric{padding:15px}.metric strong{font-size:25px}}
@media(max-width:700px){.shell{display:block}aside{padding:12px 14px;gap:12px}.brand{padding:0}.navlabel,.sidebar-bottom{display:none}nav{display:flex;overflow:auto}nav button{white-space:nowrap;font-size:13px;padding:9px}nav button span{display:none}.topbar{padding:12px 16px}.crumb{display:none}.profile{width:100%;justify-content:space-between}.profile select{min-width:0;flex:1}main{padding:21px 14px}.heading{align-items:start;flex-direction:column;gap:13px}h1{font-size:24px}.metrics{grid-template-columns:1fr 1fr}.metric strong{font-size:25px}.filters{padding:14px;gap:10px}.filters button{grid-column:1/-1}.cardhead{padding:16px}.cardbody{padding:16px}.checks,.formgrid{grid-template-columns:1fr}.detailgrid{grid-template-columns:1fr 1fr}.demo{font-size:11px;padding:7px 12px}.footer-table{align-items:start;flex-direction:column}.modalbody{padding:18px}.modalfoot{padding:13px 18px}.full{grid-column:auto}.actions button{font-size:13px}.profile label{font-size:11px}}
</style><link rel="stylesheet" href="/crm_app.css"></head>
<body><section id="access"></section><div class="shell" hidden>
<aside><div class="brand"><div class="mark">+</div><div><strong>Microregulação</strong><small>Central de acompanhamento</small></div></div><div><div class="navlabel" id="navLabel">Administração</div><nav id="nav"></nav></div><div class="sidebar-bottom"><b>Microregulação • CRM</b>Acesso restrito às unidades autorizadas.</div></aside>
<div class="workspace"><header class="topbar"><div class="crumb">Regulação / <b id="breadcrumb">Visão geral</b></div><div class="profile"><span class="avatar" id="avatar">AD</span><span id="sessionName"></span><button class="small" id="logout">Sair</button></div></header><main id="app"></main></div></div>
<dialog id="modal"><div id="modalContent"></div></dialog><div id="toast" class="toast" role="status" hidden></div>
<script>
'use strict';
const SOURCE_HEADERS=["USUÁRIO DA SAÚDE","DATA DE NASCIMENTO","CPF","CNS USUÁRIO SAÚDE","PROCEDIMENTO","ÁREA DO CORPO","ESTABELECIMENTO SOLICITANTE","DATA SOLICITAÇÃO","DATA CRIAÇÃO SOLICITAÇÃO","DATA ENTRADA REGULAÇÃO","DATA ATENDIMENTO","PROFISSIONAL SOLICITANTE","ESPECIALIDADE DO PROFISSIONAL","DIAGNÓSTICO","TEL CELULAR","TEL. RECADO","TEL. RESIDENCIAL","TIPO DA SOLICITAÇÃO","SITUAÇÃO","PRIORIDADE","QUANTIDADE PROCEDIMENTOS","ORIGEM DA SOLICITAÇÃO","QUEM APROVOU SOLICITAÇÃO:"];
const UNITS=["UBS JOSE FRANCISCO CAIABA","UBS DRA. KATIA KOHLER","UBS VINCE NEMETH","UBS PASTOR JOSE ROBERTO ROSSI","UBS EDINI CAVALCANTE CONSOLI","UBS HELIO BERZAGHI","UBS PEDRO IZZO","UBS ARMANDO GONCALVES DE FREITAS","UBS JULIO LIZART","UBS CLEUSO DE OLIVEIRA","UBS DR ADAUTO RIBEIRO","UBS BENEDITO DE OLIVEIRA CRUDO","UBS MARIA FRANCISCA DE MELO","UBS DR LUIZ FERNANDO NARDY VASCONCELLOS","UBS DRA. ELISABETE IZILDA DULEBA","UBS RAQUEL SANDRINI RUELA","UBS HERMELINO LIBERATO FILHO","UBS JOAO DE SIQUEIRA","UBS MARIA MAGDALENA MACEDO","UBS ROQUE RIBEIRO MACHADO","UBS AMARO JOSE DE SOUZA","UBS ALDEIA DA SERRA","SERVICO DE ATENDIMENTO DOMICILIAR - SAD - MARIA DE LOURDES DA SILVA - LURDINHA"];
const STATUS=['RETIRADO','AGENDADO','SEM DISPONIBILIDADE','1ª TENTATIVA','2ª TENTATIVA','BLOQUEADO','AGENDADO PELO CALL CENTER','RETIRADO PELO CALL CENTER','CIENTE'];
const OUTPUT_HEADERS=['DATA EXTRAÇÃO','USUÁRIO DA SAÚDE','DATA DE NASCIMENTO','CPF','CNS USUÁRIO SAÚDE','PROCEDIMENTO','SITUAÇÃO','COLABORADOR','DATA 1º CONTATO','DATA 2º CONTATO','DATA 3º CONTATO','DATA SOLICITAÇÃO','ESTABELECIMENTO SOLICITANTE','TEL CELULAR','TEL. RECADO','TEL. RESIDENCIAL','PROFISSIONAL SOLICITANTE','PRIORIDADE'];
const $=s=>document.querySelector(s), escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toUpperCase().replace(/\s+/g,' ');
const shortUnit=u=>u.startsWith('SERVICO DE ATENDIMENTO DOMICILIAR')?'SAD • Lurdinha':u;
const dateDisplay=v=>v?new Date(v.length===10?v+'T12:00:00':v).toLocaleDateString('pt-BR'):'—';
const timeDisplay=v=>new Date(v).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const uid=()=>crypto.randomUUID?.()??('id-'+Date.now()+'-'+Math.random().toString(16).slice(2));

let state={users:[],lots:[],records:[],activity:[]};
let role='admin',page='overview',pending=null,filters={search:'',unit:'',status:'',lot:''},offset=0;const PAGE_SIZE=12;
function save(){throw Error("Use a API para salvar.");}
function activity(text,by='Administrador'){state.activity.unshift({at:new Date().toISOString(),by,text});state.activity=state.activity.slice(0,300);}
function toast(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').hidden=true,4300);}
function currentUser(){return state.users.find(u=>u.id===role);}
function isAdmin(){return role==='admin';}
function visibleRecords(){const user=currentUser();return isAdmin()?state.records:state.records.filter(r=>user?.active&&user.units.includes(r.unit));}
function filled(r){return !!r.status.trim();}
function badge(status){const cls=!status?'gray':['AGENDADO','RETIRADO','CIENTE','AGENDADO PELO CALL CENTER','RETIRADO PELO CALL CENTER'].includes(status)?'green':status==='BLOQUEADO'?'red':'pending';return `<span class="pill ${cls}">${escapeHtml(status||'NÃO PREENCHIDO')}</span>`;}
function percent(a,b){return b?Math.round(100*a/b):0;}
function opts(items,value=''){return items.map(([v,l])=>`<option value="${escapeHtml(v)}" ${v===value?'selected':''}>${escapeHtml(l)}</option>`).join('');}
function profileRender(){const p=$('#profile');p.innerHTML=opts([['admin','Administrador'],...state.users.filter(u=>u.active).map(u=>[u.id,u.name])],role);$('#avatar').textContent=isAdmin()?'AD':currentUser().name.slice(0,2).toUpperCase();}
function render(){profileRender();const admin=isAdmin();const nav=admin?[['overview','◫','Visão geral'],['records','▤','Registros'],['upload','⇧','Importar base'],['users','♙','Usuários e acesso'],['history','◷','Histórico de lotes']]:[['records','▤','Meus registros'],['history','◷','Meus lotes']];if(!nav.some(x=>x[0]===page))page=admin?'overview':'records';$('#navLabel').textContent=admin?'Administração':'Minha unidade';$('#nav').innerHTML=nav.map(([p,i,l])=>`<button data-page="${p}" class="${page===p?'active':''}"><span aria-hidden="true">${i}</span>${l}</button>`).join('');$('#breadcrumb').textContent=nav.find(x=>x[0]===page)[2];({overview:overview,records:records,upload:upload,users:users,history:lotHistory})[page]();}
function heading(k,title,subtitle,actions=''){return `<div class="heading"><div><div class="eyebrow">${k}</div><h1>${title}</h1><p>${subtitle}</p></div><div class="actions">${actions}</div></div>`;}
function metric(label,value,foot,featured=false){return `<div class="metric ${featured?'featured':''}"><label>${label}</label><strong>${value}</strong><small>${foot}</small></div>`;}
function overview(){const all=state.records,n=all.filter(filled).length,units=[...new Set(all.map(r=>r.unit))];$('#app').innerHTML=heading('Administrador','Visão geral','Acompanhe a distribuição dos lotes e o trabalho das unidades.','<button data-page="users">Gerenciar acessos</button><button class="primary" data-page="upload">Importar base</button>')+`<div class="metrics">${metric('Solicitações',all.length,`${state.lots.length} lotes registrados`,true)}${metric('Situação preenchida',n,`${percent(n,all.length)}% dos registros`)}${metric('Sem preenchimento',all.length-n,'Aguardando atuação da unidade')}${metric('Usuários ativos',state.users.filter(u=>u.active).length,`${units.length} unidades com registros`)}</div><div class="twocol"><section class="card"><div class="cardhead"><div><h2>Acompanhamento por unidade</h2><p>Todos os lotes · preenchimento da situação</p></div></div><div class="tablewrap"><table><thead><tr><th>Unidade</th><th>Usuários</th><th>Registros</th><th>Preenchimento</th><th></th></tr></thead><tbody>${units.map(u=>{const rs=all.filter(r=>r.unit===u),n=rs.filter(filled).length,users=state.users.filter(x=>x.active&&x.units.includes(u));return `<tr><td><strong>${escapeHtml(shortUnit(u))}</strong>${!users.length?'<small>Sem usuário vinculado</small>':''}</td><td>${users.length}</td><td>${rs.length}</td><td>${percent(n,rs.length)}% <small>${n} de ${rs.length}</small><progress value="${n}" max="${rs.length}" aria-label="Preenchimento da situação"></progress></td><td><button class="small" data-unit="${escapeHtml(u)}">Abrir</button></td></tr>`;}).join('')}</tbody></table></div></section><div><section class="card"><div class="cardhead"><div><h2>Atividade recente</h2><p>Alterações e distribuições</p></div></div><div class="cardbody">${state.activity.slice(0,5).map(a=>`<div class="activity"><span class="event" aria-hidden="true">◷</span><div><p>${escapeHtml(a.text)}</p><small>${escapeHtml(a.by)} · ${timeDisplay(a.at)}</small></div></div>`).join('')||'<p>Sem atividade registrada.</p>'}</div></section><section class="card"><div class="statline"><span>Última distribuição</span><b>${dateDisplay(state.lots.at(-1)?.extracted)}</b></div><div class="statline"><span>Regra de preenchimento</span><b>Situação informada</b></div></section></div></div>`;}
function selectedRecords(){return visibleRecords().filter(r=>(!filters.search||norm([r.name,r.cpf,r.cns,r.procedure].join(' ')).includes(norm(filters.search)))&&(!filters.unit||r.unit===filters.unit)&&(!filters.lot||r.lot===filters.lot)&&(!filters.status||(filters.status==='empty'?!r.status:r.status===filters.status)));}
function records(){const available=visibleRecords(),units=[...new Set(available.map(r=>r.unit))],lots=state.lots.filter(l=>available.some(r=>r.lot===l.id));if(filters.unit&&!units.includes(filters.unit))filters.unit='';if(filters.lot&&!lots.some(l=>l.id===filters.lot))filters.lot='';const rows=selectedRecords(),n=rows.filter(filled).length;offset=Math.min(offset,Math.max(0,Math.ceil(rows.length/PAGE_SIZE)-1));$('#app').innerHTML=heading(isAdmin()?'Administrador':'Área do usuário',isAdmin()?'Registros das unidades':'Meus registros',isAdmin()?'Consulte os registros e acompanhe o preenchimento.':`${currentUser()?.name||'Usuário'} · acesso às unidades autorizadas`,'<button id="export">Exportar recorte Excel</button>')+`<div class="metrics">${metric('Registros no recorte',rows.length,`${available.length} registros acessíveis`,true)}${metric('Situação preenchida',n,`${percent(n,rows.length)}% deste recorte`)}${metric('Sem preenchimento',rows.length-n,'Situação ainda não informada')}${metric('Unidades acessíveis',units.length,isAdmin()?'Visão de todas as unidades':'Conforme permissão do administrador')}</div><section class="card"><div class="filters"><label class="field">Buscar<input id="search" value="${escapeHtml(filters.search)}" placeholder="Nome, CPF, CNS ou procedimento"></label><label class="field">Unidade<select id="filter-unit">${opts([['','Todas as unidades'],...units.map(u=>[u,shortUnit(u)])],filters.unit)}</select></label><label class="field">Situação<select id="filter-status">${opts([['','Todas as situações'],['empty','Não preenchido'],...STATUS.map(s=>[s,s])],filters.status)}</select></label><label class="field">Lote<select id="filter-lot">${opts([['','Todos os lotes'],...lots.map(l=>[l.id,l.name+' · '+l.source])],filters.lot)}</select></label><button id="clearFilters">Limpar</button></div><div class="tablewrap"><table><thead><tr><th>Usuário da saúde</th><th>Procedimento / unidade</th><th>Situação</th><th>Colaborador</th><th>Último contato</th><th></th></tr>< function download(name,text,type='text/csv;charset=utf-8'){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function csv(rows){return '\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\r\n');}
function sample(){const units=['UBS PEDRO IZZO','UBS RAQUEL SANDRINI RUELA',UNITS.find(u=>u.startsWith('SERVICO DE ATENDIMENTO DOMICILIAR'))];const rows=Array.from({length:9},(_,i)=>SOURCE_HEADERS.map(h=>({'USUÁRIO DA SAÚDE':'Pessoa Fictícia Importada '+(i+1),'DATA DE NASCIMENTO':'15/06/1985','CPF':'FICTÍCIO-'+(i+1),'CNS USUÁRIO SAÚDE':'CNS-DEMO-'+(i+1),'PROCEDIMENTO':'CONSULTA FICTÍCIA DE CARDIOLOGIA','ESTABELECIMENTO SOLICITANTE':units[i%3],'DATA SOLICITAÇÃO':'01/10/2026','TEL CELULAR':'(00) 00000-0000','PROFISSIONAL SOLICITANTE':'Profissional fictício','PRIORIDADE':'NORMAL','SITUAÇÃO':'APROVADO'}[h]||'')));download('BASE_FICTICIA_APROVADOS.csv',csv([SOURCE_HEADERS,...rows]));}
function exportRecords(){const rows=selectedRecords().map(r=>{const l=state.lots.find(l=>l.id===r.lot);return[l.extracted,r.name,r.birth,r.cpf,r.cns,r.procedure,r.status,r.collaborator,...r.contacts,r.requested,r.unit,r.phone,r.phone2,r.phone3,r.professional,r.priority];});download('RECORTE_MICROREGULACAO.csv',csv([OUTPUT_HEADERS,...rows]));toast(`${rows.length} registros exportados.`);}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-close')){$('#modal').close();return;}if(b.dataset.page){page=b.dataset.page;offset=0;render();}if(b.dataset.unit){filters={search:'',unit:b.dataset.unit,status:'',lot:''};offset=0;page='records';render();}if(b.dataset.lot){filters={search:'',unit:'',status:'',lot:b.dataset.lot};offset=0;page='records';render();}if(b.dataset.edit)openRecord(b.dataset.edit);if(b.dataset.user)openUser(b.dataset.user);({chooseFile:()=>$('#fileInput').click(),sample,commitUpload,cancelUpload:()=>{pending=null;upload();},export:exportRecords,newUser:()=>openUser(),clearFilters:()=>{filters={search:'',unit:'',status:'',lot:''};offset=0;records();},prev:()=>{offset--;records();},next:()=>{offset++;records();}})[b.id]?.();});
document.addEventListener('change',e=>{if(e.target.id==='fileInput')acceptFile(e.target.files[0]);const key={'filter-unit':'unit','filter-status':'status','filter-lot':'lot'}[e.target.id];if(key){filters[key]=e.target.value;offset=0;records();}});
document.addEventListener('input',e=>{if(e.target.id==='search'){const pos=e.target.selectionStart;filters.search=e.target.value;offset=0;records();$('#search').focus();$('#search').setSelectionRange(pos,pos);}});
document.addEventListener('dragover',e=>{if(e.target.closest('#drop')){e.preventDefault();$('#drop').classList.add('drag');}});document.addEventListener('dragleave',e=>{if(e.target.closest('#drop'))$('#drop').classList.remove('drag');});document.addEventListener('drop',e=>{if(e.target.closest('#drop')){e.preventDefault();$('#drop').classList.remove('drag');acceptFile(e.dataTransfer.files[0]);}});

</script><script src="/crm_domain.js"></script><script src="/crm_app.js"></script></body></html>
